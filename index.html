<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO FOOTBALL - Full Team Restoration</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <div id="stats">SCORE: <span id="score" style="color:var(--nfl-orange)">0</span></div>
    </div>
    
    <div id="msg">TACKLED!</div>

    <div id="menu">
        <h1 style="font-size: 90px; margin: 0; letter-spacing: -4px;">PRO FOOTBALL</h1>
        <button class="btn" id="start-btn">START GAME</button>
        <p style="margin-top:20px;">
            <b>WASD</b> Move | <b>SHIFT</b> Sprint | <b>Y</b> Kick | <b>CLICK</b> Throw | <b>U</b> Switch Cam
        </p>
        <p style="font-size: 14px; opacity: 0.7;">STAY BEHIND YOUR BLOCKERS!</p>
    </div>

    <script src="game.js"></script>
</body>
</html>
